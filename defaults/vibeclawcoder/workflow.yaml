# Replace placeholder models with the GitHub app version's configured model IDs.
roles:
  developer:
    levels: [standard]
    defaultLevel: standard
    maxWorkers: 2
    models:
      standard: <GITHUB_APP_MODEL_DEVELOPER_STANDARD>
  reviewer:
    levels: [standard]
    defaultLevel: standard
    maxWorkers: 1
    models:
      standard: <GITHUB_APP_MODEL_REVIEWER_STANDARD>
  architect: false
  tester: false

workflow:
  initial: planning
  reviewPolicy: agent
  roleExecution: parallel
  roleFallbacks:
    tester: reviewer
    architect: reviewer
